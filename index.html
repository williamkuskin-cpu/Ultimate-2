<style>

.boardbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.nav{display:grid;grid-template-columns:repeat(3,30px);gap:3px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--btn);color:var(--btn-fg);
  padding:10px 16px;border-radius:10px;font-weight:700;max-width:calc(100% - 32px);z-index:20}

<script>
/* ===================== rules engine (unchanged house rules) ===================== */
const POS=["top-left","top","top-right","left","center","right","bottom-left","bottom","bottom-right"];
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function hasLine(v,p,wild){return LINES.some(l=>l.every(k=>v[k]===p||(wild&&v[k]===3)))}
function fresh(){return{cells:new Array(729).fill(0),small:new Array(81).fill(0),ult:new Array(9).fill(0),big:0,target:{u:null,s:null},last:-1,n:0}}
function parts(i){return{u:Math.floor(i/81),s:Math.floor(i/9)%9,c:i%9}}
function legal(st,i){
  if(st.big||!Number.isInteger(i)||i<0||i>728)return false;
  const{u,s}=parts(i);
  if(st.cells[i]||st.small[u*9+s]||st.ult[u])return false;
  if(st.target.u===null)return true;
  if(u!==st.target.u)return false;
  return st.target.s===null||s===st.target.s;
}
function apply(st,i){
  const p=st.n%2===0?1:2,q=3-p,{u,s,c}=parts(i);
  st.cells[i]=p;st.last=i;st.n++;
  const si=u*9+s,sv=st.cells.slice(u*81+s*9,u*81+s*9+9);
  if(hasLine(sv,p,false))st.small[si]=p;else if(sv.every(Boolean))st.small[si]=3;
  if(st.small[si]){
    const uv=st.small.slice(u*9,u*9+9);
    const a=hasLine(uv,p,true),b=hasLine(uv,q,true);
    if(a&&b)st.ult[u]=3;else if(a)st.ult[u]=p;else if(b)st.ult[u]=q;else if(uv.every(Boolean))st.ult[u]=3;
    if(st.ult[u]){
      const A=hasLine(st.ult,p,true),B=hasLine(st.ult,q,true);
      if(A&&B)st.big=3;else if(A)st.big=p;else if(B)st.big=q;else if(st.ult.every(Boolean))st.big=3;
    }
  }
  if(st.big){st.target={u:null,s:null};return}
  let T=s;
  if(st.ult[T])T=u;
  if(st.ult[T]){st.target={u:null,s:null};return}
  st.target={u:T,s:st.small[T*9+c]?null:c};
}
const enc=m=>m.map(x=>x.toString(36).padStart(2,"0")).join("");
const dec=s=>{const o=[];for(let k=0;k+1<(s||"").length;k+=2)o.push(parseInt(s.slice(k,k+2),36));return o};
function replay(moves){const st=fresh();for(const m of (Array.isArray(moves)?moves:[])){if(!legal(st,m))break;apply(st,m)}return st}

/* ===================== backend: Supabase, or a test stand-in ===================== */
/* Both offer: onAuth, signUp, signIn, signOut, watchUser, userName, createGame, join, leave, watchGame, move, resign.
   Errors carry .code = the reason word the database sends (name_taken, bad_login, in_game, full, ...). */
function supabaseBackend(cfg){
  const sb=supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:false,autoRefreshToken:false}});
  let tok=lsGet("u2-token",""),authCb=null,userCbs=new Set();
  const REASONS=["bad_session","bad_name","weak_password","name_taken","bad_login","in_game","no_game","full","game_over","bad_move","not_your_turn","not_player"];
  async function rpc(fn,args){
    const{data,error}=await sb.rpc(fn,args);
    if(error){const msg=String(error.message||"");const code=REASONS.find(r=>msg.includes(r))||(error.code==="PGRST000"||/fetch|network/i.test(msg)?"network":"unknown");
      if(code==="bad_session"){tok="";lsSet("u2-token","");authCb&&authCb(null)}
      throw{code,message:msg}}
    return data;
  }
  async function refreshMe(){if(!tok)return;try{const v=await rpc("u2_me",{tok});userCbs.forEach(f=>f(v))}catch(e){}}
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshMe()});
  const startSession=r=>{tok=r.token;lsSet("u2-token",tok);authCb({uid:r.id})};
  return{
    onAuth(cb){authCb=cb;if(!tok){cb(null);return}
      rpc("u2_me",{tok}).then(v=>cb({uid:v.id}),e=>{if(e.code!=="bad_session")cb(null)})},
    async signUp(name,pw){startSession(await rpc("u2_signup",{p_name:name,p_pw:pw}))},
    async signIn(name,pw){startSession(await rpc("u2_signin",{p_name:name,p_pw:pw}))},
    async signOut(){const t=tok;tok="";lsSet("u2-token","");try{await rpc("u2_signout",{tok:t})}catch(e){}authCb(null)},
    watchUser(uid,cb){userCbs.add(cb);refreshMe();return()=>userCbs.delete(cb)},
    async userName(id){const{data}=await sb.from("players").select("name").eq("id",id).maybeSingle();return(data&&data.name)||""},
    async createGame(){const gid=await rpc("u2_create_game",{tok});await refreshMe();return gid},
    async join(gid){await rpc("u2_join_game",{tok,p_gid:gid});await refreshMe()},
    async leave(){await rpc("u2_leave_game",{tok});await refreshMe()},
    watchGame(gid,cb){
      let alive=true;
      const load=async()=>{const{data,error}=await sb.from("games").select("x,o,m,q,t").eq("id",gid).maybeSingle();if(alive&&!error)cb(data)};
      const ch=sb.channel("game-"+gid).on("postgres_changes",{event:"UPDATE",schema:"public",table:"games",filter:"id=eq."+gid},p=>{if(alive)cb(p.new)})
        .subscribe(s=>{if(s==="SUBSCRIBED")load()});
      const vis=()=>{if(!document.hidden)load()};document.addEventListener("visibilitychange",vis);
      load();
      return()=>{alive=false;sb.removeChannel(ch);document.removeEventListener("visibilitychange",vis)};
    },
    move:(gid,m)=>rpc("u2_move",{tok,p_gid:gid,p_m:m}),
    resign:gid=>rpc("u2_resign",{tok,p_gid:gid}),
  };
}
function mockBackend(){ // for testing only: imitates the database's checks, shared between tabs through localStorage
  const K="u2mock",read=()=>{try{return JSON.parse(localStorage.getItem(K)||"{}")}catch(e){return{}}};
  const write=d=>{localStorage.setItem(K,JSON.stringify(d));fire()};
  const subs=new Set();const fire=()=>subs.forEach(f=>f());window.addEventListener("storage",e=>{if(e.key===K)fire()});
  let authCb=null;const me=()=>sessionStorage.getItem("u2mock-uid");const fail=code=>{throw{code}};
  const watch=(get,cb)=>{let last;const f=()=>{const v=JSON.stringify(get(read())??null);if(v!==last){last=v;cb(JSON.parse(v))}};subs.add(f);setTimeout(f,0);return()=>subs.delete(f)};
  return{
    onAuth(cb){authCb=cb;setTimeout(()=>cb(me()?{uid:me()}:null),0)},
    async signUp(name,pw){const d=read();d.acct=d.acct||{};if(d.acct[name.toLowerCase()])fail("name_taken");
      const uid="u"+Math.random().toString(36).slice(2,8);d.acct[name.toLowerCase()]={uid,pw};d.users=d.users||{};d.users[uid]={id:uid,name};write(d);sessionStorage.setItem("u2mock-uid",uid);authCb({uid})},
    async signIn(name,pw){const a=(read().acct||{})[name.toLowerCase()];if(!a||a.pw!==pw)fail("bad_login");sessionStorage.setItem("u2mock-uid",a.uid);authCb({uid:a.uid})},
    async signOut(){sessionStorage.removeItem("u2mock-uid");authCb(null)},
    watchUser:(uid,cb)=>watch(d=>(d.users||{})[uid],cb),
    async userName(uid){return((read().users||{})[uid]||{}).name||""},
    async createGame(){const d=read(),u=d.users[me()];if(u.game)fail("in_game");d.games=d.games||{};const gid="g"+Math.random().toString(36).slice(2,9);d.games[gid]={x:me(),m:"",t:Date.now()};u.game=gid;write(d);return gid},
    async join(gid){const d=read(),g=(d.games||{})[gid],u=d.users[me()];if(!g)fail("no_game");
      if(g.x===me()||g.o===me()){u.game=gid;write(d);return}if(g.o)fail("full");if(u.game)fail("in_game");g.o=me();u.game=gid;write(d)},
    async leave(){const d=read();delete d.users[me()].game;write(d)},
    watchGame:(gid,cb)=>watch(d=>(d.games||{})[gid],cb),
    async move(gid,newM){const d=read(),g=d.games[gid],n=g.m.length;if(g.q)fail("game_over");if(newM.length!==n+2||!newM.startsWith(g.m))fail("bad_move");
      if((n%4===0&&me()!==g.x)||(n%4===2&&me()!==g.o))fail("not_your_turn");g.m=newM;write(d)},
    async resign(gid){const d=read();d.games[gid].q=me();write(d)},
  };
}

/* ===================== page ===================== */
const app=document.getElementById("app"),toastEl=document.getElementById("toast");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const svgX=(w=1.5)=>`<svg viewBox="0 0 10 10" aria-hidden="true"><path class="mk x" stroke-width="${w}" d="M2.4 2.4L7.6 7.6M7.6 2.4L2.4 7.6"/></svg>`;
const svgO=(w=1.5)=>`<svg viewBox="0 0 10 10" aria-hidden="true"><circle class="mk o" stroke-width="${w}" cx="5" cy="5" r="2.9"/></svg>`;
const mark=(p,w)=>p===1?svgX(w):p===2?svgO(w):"";
const LETTER=p=>p===1?"X":"O";
const pretty=p=>p.replace("-"," ");
function toast(msg){toastEl.textContent=msg;toastEl.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>toastEl.hidden=true,3500)}
const SITE=location.origin+location.pathname;
const lsGet=(k,d)=>{try{return localStorage.getItem(k)??d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

let B=null,uid=null,me=null,game=null,gid=null,names={},authReady=false;
let unsubUser=null,unsubGame=null,pendingJoin=null,authMode="signin",formErr="",busy=false;
let zoomU=null,sel=-1,seenN=-1,animIdx=-1,confirmResign=false,showSettings=false;

const m=/^#join-([A-Za-z0-9_-]{4,40})$/.exec(location.hash||"");
if(m){pendingJoin=m[1];try{sessionStorage.setItem("u2-join",pendingJoin)}catch(e){}}
else{try{pendingJoin=sessionStorage.getItem("u2-join")}catch(e){}}
try{history.replaceState(null,"",SITE)}catch(e){}

function authError(e){
  const c=(e&&e.code)||"";
  if(c==="name_taken")return"That username is taken. Pick another.";
  if(c==="bad_login")return"Username or password is wrong.";
  if(c==="weak_password")return"Password needs at least 6 characters.";
  if(c==="bad_name")return"Usernames are 3 to 20 letters, numbers or underscores.";
  if(c==="network")return"Couldn't reach the game server. Check your connection and try again.";
  return"Something went wrong. Try again.";
}
async function nameOf(id){if(!id)return"";if(!(id in names)){names[id]="";names[id]=await B.userName(id);render()}return names[id]}

/* ----- texting ----- */
function smsHref(body){const n=lsGet("u2-friend-num","").replace(/[^\d+]/g,"");return`sms:${n}&body=${encodeURIComponent(body)}`}
function textFriend(body){location.href=smsHref(body)}

/* ----- auth screens ----- */
function renderAuth(){
  const joining=!!pendingJoin;
  app.innerHTML=`<div class="stack" style="gap:22px">
    <header class="stack" style="gap:8px"><h1>Ultimate<sup>2</sup></h1>
      <p class="muted" style="max-width:56ch">Tic-tac-toe three levels deep: 9 ultimate boards, 81 small boards, 729 squares.</p></header>
    ${joining?`<div class="banner">A friend invited you to a game. ${authMode==="signup"?"Make an account":"Sign in"} and you'll join it right away.</div>`:""}
    <section class="card stack">
      <h2>${authMode==="signup"?"Make an account":"Sign in"}</h2>
      <form id="authform" novalidate>
        <label class="f">Username<input type="text" id="u-name" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20" required></label>
        <label class="f">Password<input type="password" id="u-pw" autocomplete="${authMode==="signup"?"new-password":"current-password"}" minlength="6" required></label>
        ${formErr?`<p class="err">${esc(formErr)}</p>`:""}
        <div class="row"><button class="btn" type="submit"${busy?" disabled":""}>${authMode==="signup"?"Make account":"Sign in"}</button></div>
      </form>
      <p class="muted">${authMode==="signup"?`Already have an account? <button class="btn ghost small" data-act="mode" data-m="signin">Sign in</button>`:`New here? <button class="btn ghost small" data-act="mode" data-m="signup">Make an account</button>`}</p>
      ${authMode==="signup"?`<p class="muted" style="font-size:.9rem">Usernames are 3 to 20 letters, numbers or underscores. There's no email, so write your password down: it can't be reset.</p>`:""}
    </section>
    ${rulesHTML()}
  </div>`;
}
async function submitAuth(){
  const name=document.getElementById("u-name").value.trim(),pw=document.getElementById("u-pw").value;
  if(!/^[A-Za-z0-9_]{3,20}$/.test(name)){formErr="Usernames are 3 to 20 letters, numbers or underscores.";render();return}
  if(pw.length<6){formErr="Password needs at least 6 characters.";render();return}
  busy=true;formErr="";render();
  try{if(authMode==="signup")await B.signUp(name,pw);else await B.signIn(name,pw)}
  catch(e){formErr=authError(e)}
  busy=false;render();
}

/* ----- signed in, no current game ----- */
function renderLobby(){
  app.innerHTML=`<div class="stack" style="gap:22px">
    ${topbar()}
    <header class="stack" style="gap:8px"><h1>Ultimate<sup>2</sup></h1>
      <p class="muted" style="max-width:56ch">Start a game, then text your friend the invite. You can be in one game at a time.</p></header>
    <div class="row"><button class="btn" data-act="new"${busy?" disabled":""}>Start a new game</button></div>
    ${pendingJoin?`<div class="banner">Joining your friend's game…</div>`:""}
    ${settingsHTML()}
    ${rulesHTML()}
  </div>`;
}
function topbar(){
  return`<div class="topbar"><span class="muted">Signed in as <b>${esc(me&&me.name||"…")}</b></span>
    <div class="row"><button class="btn ghost small" data-act="settings">Texting</button><button class="btn ghost small" data-act="signout">Sign out</button></div></div>`;
}
function settingsHTML(){
  if(!showSettings)return"";
  const auto=lsGet("u2-auto","1")==="1";
  return`<section class="card stack" style="gap:12px"><h2>Texting your friend</h2>
    <label class="f">Friend's phone number (optional)<input type="tel" id="friend-num" value="${esc(lsGet("u2-friend-num",""))}" placeholder="Leave blank to pick them in Messages"></label>
    <label class="row" style="font-weight:700"><input type="checkbox" id="auto-text"${auto?" checked":""}> Open Messages after each move</label>
    <p class="muted" style="font-size:.9rem">The number is saved only on this phone. With it filled in, Messages opens with the text addressed to your friend, so you just tap send.</p>
    <div class="row"><button class="btn small" data-act="save-settings">Save</button><button class="btn ghost small" data-act="settings">Close</button></div></section>`;
}

/* ----- game ----- */
function rulesHTML(){return`<details class="card"><summary>House rules</summary><ol class="rules">
<li>The board is 9 ultimate boards, each made of 9 small boards, each made of 9 squares. 729 squares in all.</li>
<li>Where you play decides where your opponent plays next. The position of the small board you played in picks their ultimate board. The position of your square picks their small board inside it.</li>
<li>If that small board is already finished, they may play anywhere in that ultimate board.</li>
<li>If that ultimate board is already finished, they stay in the ultimate board you just played in, and your square's position still picks their small board there.</li>
<li>If that board is finished too, they may play anywhere at all.</li>
<li>Win a small board to claim its spot on its ultimate board. Win an ultimate board to claim its spot on the big board. Three ultimate boards in a row wins.</li>
<li>A tied board counts for both players when making three in a row. If one move gives both players three in a row at once, that board is a tie (and on the big board, the game is a draw).</li></ol></details>`}
function describeTarget(st,mine){
  const who=mine?"You play":"They play";
  if(st.target.u===null)return`${who} anywhere on the board.`;
  const U=pretty(POS[st.target.u]);
  if(st.target.s===null)return`${who} anywhere in the <b>${U}</b> ultimate board.`;
  return`${who} in the <b>${pretty(POS[st.target.s])}</b> small board of the <b>${U}</b> ultimate board.`;
}
function cellHTML(st,i,canPlay,w,pre){
  const v=st.cells[i],lg=canPlay&&legal(st,i),{s,c}=parts(i);
  const cls=["cell"];if(lg)cls.push("legal");if(i===st.last)cls.push("last");if(i===sel)cls.push("sel");if(i===animIdx)cls.push("fresh");
  const inner=v?mark(v,w):(i===sel?mark(st.n%2===0?1:2,w):"");
  return`<button class="${cls.join(" ")}" data-act="cell" data-i="${i}"${lg?"":` tabindex="-1"`} aria-label="${pre}${pretty(POS[s])} small board, ${pretty(POS[c])} square${v?", "+LETTER(v):""}">${inner}</button>`;
}
const overHTML=(r,w)=>r?`<div class="over${r===3?" tie":""}">${r===3?"<span>tie</span>":mark(r,w)}</div>`:"";
function wholeHTML(st,canPlay){
  let h=`<div class="wb" role="grid" aria-label="Whole board">`;
  for(let u=0;u<9;u++){
    const tu=!st.big&&st.target.u===u;h+=`<div class="wu${tu?" tgt-u":""}">`;
    for(let s=0;s<9;s++){
      h+=`<div class="ws${tu&&st.target.s===s?" tgt":""}">`;
      for(let c=0;c<9;c++)h+=cellHTML(st,u*81+s*9+c,canPlay,2,`${pretty(POS[u])} ultimate board, `);
      if(!st.ult[u])h+=overHTML(st.small[u*9+s],1.3);
      h+=`</div>`;
    }
    h+=overHTML(st.ult[u],1.1)+`</div>`;
  }
  return h+`</div>`;
}
function focusHTML(st,u,canPlay){
  let h=`<div class="fb" role="grid" aria-label="${pretty(POS[u])} ultimate board">`;
  for(let s=0;s<9;s++){
    const isT=!st.big&&st.target.u===u&&(st.target.s===null?!st.small[u*9+s]:st.target.s===s);
    h+=`<div class="sb${isT?" tgt":""}">`;
    for(let c=0;c<9;c++)h+=cellHTML(st,u*81+s*9+c,canPlay,1.6,"");
    h+=overHTML(st.small[u*9+s],1.1)+`</div>`;
  }
  return h+overHTML(st.ult[u],1)+`</div>`;
}
function navHTML(st){
  let h=`<div class="nav" aria-label="Choose an ultimate board">`;
  for(let u=0;u<9;u++){const cls=[];if(u===zoomU)cls.push("cur");if(!st.big&&st.target.u===u)cls.push("req");
    h+=`<button class="${cls.join(" ")}" data-act="zoom" data-u="${u}" aria-label="Zoom to the ${pretty(POS[u])} ultimate board">${st.ult[u]===3?"tie":mark(st.ult[u],1.6)}</button>`}
  return h+`</div>`;
}
function gameOver(g,st){return !!(st.big||g.q)}

function renderGame(){
  const g=game;
  if(!g){app.innerHTML=`<div class="stack">${topbar()}<p class="muted">Loading your game…</p></div>`;return}
  const moves=dec(g.m),st=replay(moves);
  if(st.n!==seenN){animIdx=(seenN!==-1&&st.n===seenN+1)?st.last:-1;seenN=st.n;sel=-1;zoomU=null}
  const role=g.x===uid?1:g.o===uid?2:0,opp=role===1?g.o:g.x;
  nameOf(g.x);nameOf(g.o);
  const oppName=opp?(names[opp]||"Your friend"):"Waiting for a friend";
  const turnP=st.n%2===0?1:2,over=gameOver(g,st),myTurn=!over&&turnP===role&&(role===1||g.o);
  let status;
  if(g.q)status=g.q===uid?"You resigned.":`${oppName} resigned. You win!`;
  else if(st.big)status=st.big===3?"It's a draw.":st.big===role?"You won!":`${oppName} won.`;
  else if(!g.o&&turnP===2)status="Waiting for your friend to join";
  else status=myTurn?"Your turn":`${oppName}'s turn`;
  const zoomTo=st.target.u!==null?st.target.u:(st.last>=0?parts(st.last).u:4);
  const selP=sel>=0?parts(sel):null;
  const invite=!g.o&&!over?`<section class="card stack" style="gap:10px"><p><b>Invite your friend.</b> Text them this link. When they tap it and sign in, they join this game.</p>
    <input class="link" id="invitebox" readonly value="${esc(SITE+"#join-"+gid)}" aria-label="Invite link">
    <div class="row"><a class="btn" href="${esc(smsHref("Play Ultimate² with me! "+SITE+"#join-"+gid))}">Text the invite</a><button class="btn ghost" data-act="copy-invite">Copy link</button></div>
    ${role===1&&st.n===0?`<p class="muted">You're X, so you can make the first move while you wait.</p>`:""}</section>`:"";
  const nudge=g.o&&!over&&!myTurn?`<div class="row"><a class="btn ghost small" href="${esc(smsHref("Your move in Ultimate²! "+SITE))}">Text ${esc(oppName)} a reminder</a></div>`:"";
  app.innerHTML=`<div class="stack">
    ${topbar()}
    ${settingsHTML()}
    ${invite}
    <div class="players">
      <span class="pl${!over&&turnP===1?" turn":""}">${svgX(1.6)}${role===1?"You":esc(names[g.x]||"Your friend")}</span>
      <span class="pl${!over&&turnP===2?" turn":""}">${svgO(1.6)}${role===2?"You":esc(g.o?(names[g.o]||"Your friend"):"Open seat")}</span>
    </div>
    <p class="status" aria-live="polite">${esc(status)}</p>
    ${over?`<div class="row"><button class="btn" data-act="finish">Start a new game</button></div>`:`<p class="where">${describeTarget(st,myTurn)}</p>`}
    <div class="boardbar">${zoomU===null
      ?`<span class="label">Whole board</span><button class="btn ghost small" data-act="zoom" data-u="${zoomTo}">Zoom in</button>`
      :`<span class="label">Zoomed: ${pretty(POS[zoomU])} ultimate board</span><button class="btn ghost small" data-act="whole">Whole board</button>`}</div>
    ${zoomU===null?wholeHTML(st,myTurn):focusHTML(st,zoomU,myTurn)}
    ${zoomU===null?"":`<div class="row">${navHTML(st)}<span class="muted" style="font-size:.9rem;max-width:30ch">Tap a spot to zoom to a different ultimate board.</span></div>`}
    <div class="confirm">${selP?`<button class="btn" data-act="place"${busy?" disabled":""}>Place ${LETTER(turnP)} here</button><button class="btn ghost" data-act="cancel">Cancel</button><span class="muted" style="font-size:.9rem">${pretty(POS[selP.u])} ultimate · ${pretty(POS[selP.s])} small board · ${pretty(POS[selP.c])} square</span>`:(myTurn?`<span class="muted">Tap a highlighted square, then press Place.</span>`:"")}</div>
    ${nudge}
    <div class="legend"><span><i class="sw" style="background:var(--hl)"></i>where to play</span><span>${st.n} of 729 squares played</span></div>
    ${over?"":`<div class="row">${confirmResign?`<span>Resign this game? Your friend wins.</span><button class="btn small" data-act="resign-yes">Yes, resign</button><button class="btn ghost small" data-act="resign-no">Keep playing</button>`:`<button class="btn ghost small" data-act="resign">Resign</button>`}</div>`}
    ${rulesHTML()}
  </div>`;
}

function render(){
  if(!B){return}
  if(!authReady){app.innerHTML=`<p class="muted">Loading…</p>`;return}
  if(!uid)return renderAuth();
  if(!me){app.innerHTML=`<p class="muted">Loading your account…</p>`;return}
  if(!gid)return renderLobby();
  renderGame();
}

/* ----- data flow ----- */
function watchMyGame(newGid){
  if(newGid===gid)return;
  if(unsubGame){unsubGame();unsubGame=null}
  gid=newGid||null;game=null;seenN=-1;sel=-1;confirmResign=false;
  if(gid)unsubGame=B.watchGame(gid,g=>{game=g;render()});
  render();
}
async function tryJoin(){
  if(!pendingJoin||!me)return;
  const target=pendingJoin;pendingJoin=null;try{sessionStorage.removeItem("u2-join")}catch(e){}
  if(me.game===target)return;
  try{await B.join(target);toast("You joined the game!")}
  catch(e){
    toast(e.code==="in_game"?"You're already in a game. Finish or resign it, then tap the invite link again.":
      e.code==="full"?"That game already has two players.":
      e.code==="no_game"?"That invite link doesn't match a game.":"Couldn't join that game. Try the link again.");
  }
}
async function newGame(){
  if(busy)return;busy=true;render();
  try{await B.createGame()}catch(e){toast(e.code==="in_game"?"You're already in a game.":"Couldn't start a game. Check your connection.")}
  busy=false;render();
}
function place(i){
  const g=game,st=replay(dec(g.m)),role=g.x===uid?1:2;
  if(!legal(st,i)||role!==(st.n%2===0?1:2)){sel=-1;render();return}
  const newM=g.m+enc([i]);
  busy=true;sel=-1;render();
  B.move(gid,newM).then(()=>{busy=false;render()},e=>{busy=false;toast(e&&e.code==="not_your_turn"?"It's not your turn.":e&&e.code==="game_over"?"This game is over.":"That move didn't save. Check your connection and try again.");render()});
  // open Messages right away, while this tap still counts as the player's action
  if(g.o&&lsGet("u2-auto","1")==="1"&&!replay(dec(newM)).big)textFriend("Your move in Ultimate²! "+SITE);
  else if(g.o&&replay(dec(newM)).big&&lsGet("u2-auto","1")==="1")textFriend("Game over in Ultimate²! Come see the final board: "+SITE);
}

app.addEventListener("submit",e=>{e.preventDefault();if(e.target.id==="authform")submitAuth()});
app.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act;
  if(act==="mode"){authMode=b.dataset.m;formErr="";render()}
  else if(act==="signout"){if(unsubUser)unsubUser();unsubUser=null;watchMyGame(null);me=null;B.signOut()}
  else if(act==="new")newGame();
  else if(act==="finish"){B.leave().catch(()=>toast("Couldn't reach the game server. Try again."))}
  else if(act==="settings"){showSettings=!showSettings;render()}
  else if(act==="save-settings"){lsSet("u2-friend-num",document.getElementById("friend-num").value.trim());lsSet("u2-auto",document.getElementById("auto-text").checked?"1":"0");showSettings=false;toast("Saved on this phone.");render()}
  else if(act==="copy-invite"){const el=document.getElementById("invitebox");const fb=()=>{el.focus();el.select();toast("Copy the selected link.")};
    try{navigator.clipboard.writeText(el.value).then(()=>toast("Invite link copied."),fb)}catch(err){fb()}}
  else if(act==="resign"){confirmResign=true;render()}
  else if(act==="resign-no"){confirmResign=false;render()}
  else if(act==="resign-yes"){confirmResign=false;B.resign(gid).catch(()=>toast("Couldn't resign. Check your connection."))}
  else if(act==="zoom"){zoomU=+b.dataset.u;render()}
  else if(act==="whole"){zoomU=null;render()}
  else if(act==="cancel"){sel=-1;render()}
  else if(act==="place"){if(sel>=0)place(sel)}
  else if(act==="cell"){if(!b.classList.contains("legal"))return;const i=+b.dataset.i;sel=(sel===i)?-1:i;render()}
});

/* ----- boot ----- */
(function boot(){
  const cfg=window.U2_SUPABASE;
  if(window.U2_TEST_MOCK)B=mockBackend();
  else if(!cfg||!cfg.url||!cfg.key||!window.supabase){app.innerHTML=`<div class="stack"><h1>Ultimate<sup>2</sup></h1><div class="banner">${window.supabase?"This game isn't connected to its database yet.":"Couldn't load the game. Check your internet connection and reopen it."}</div></div>`;return}
  else B=supabaseBackend(cfg);
  B.onAuth(u=>{
    authReady=true;
    if(unsubUser){unsubUser();unsubUser=null}
    uid=u?u.uid:null;me=null;
    if(!uid){watchMyGame(null);render();return}
    unsubUser=B.watchUser(uid,v=>{
      const first=!me;me=v||{name:""};if(me.name)names[uid]=me.name;
      watchMyGame(me.game||null);
      if(first)tryJoin();
      render();
    });
    render();
  });
})();
</script>
</body>
</html>
